<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pathways</title>
<style>
  /* Aim's own page in YouTube's palette, following Chrome's light/dark mode. Pathways' accent is
     the same calm blue as Aim Homeschool; Aim red appears only in the mark. */
  :root { --bg:#f9f9f9; --card:#fff; --text:#0f0f0f; --muted:#606060; --divider:rgba(0,0,0,.1); --tonal:rgba(0,0,0,.05); --tonal-hover:rgba(0,0,0,.1);
          --field:#fff; --field-border:#ccc; --focus:#1c62b9; --link:#065fd4; --raised:#fff; --blue:#1a66d6; --blue-soft:rgba(26,102,214,.08);
          --s1:#1a66d6; --s2:#2f9e44; --s3:#b7791f; --s4:#7048e8; --ok:#2ba640; --shadow:0 2px 16px rgba(0,0,0,.06); }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f0f0f; --card:#1d1d1d; --text:#f1f1f1; --muted:#aaa; --divider:rgba(255,255,255,.1); --tonal:rgba(255,255,255,.1); --tonal-hover:rgba(255,255,255,.2);
            --field:#121212; --field-border:#303030; --link:#3ea6ff; --raised:#212121; --blue:#6aa5f8; --blue-soft:rgba(106,165,248,.12);
            --s1:#6aa5f8; --s2:#5fcf73; --s3:#e0a94a; --s4:#a58bff; --shadow:0 2px 16px rgba(0,0,0,.4); }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/20px Roboto, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  main { max-width: 1180px; margin: 0 auto; padding: 24px 24px 80px; }
  header.top { display: flex; align-items: center; gap: 8px; color: var(--muted); margin-bottom: 20px; }
  header.top img { width: 24px; height: 24px; }
  .for-dark { display: none; }
  @media (prefers-color-scheme: dark) { .for-dark { display: inline; } .for-light { display: none; } }
  h1 { font-size: 28px; line-height: 36px; font-weight: 700; margin: 0 0 6px; }
  h2 { font-size: 20px; line-height: 28px; font-weight: 700; margin: 0 0 4px; }
  h3 { font-size: 16px; line-height: 22px; font-weight: 500; margin: 0 0 4px; }
  p { margin: 0 0 12px; }
  .muted { color: var(--muted); } .small { font-size: 12px; line-height: 18px; }
  .lede { color: var(--muted); font-size: 15px; line-height: 22px; margin-bottom: 20px; }
  a { color: var(--link); text-decoration: none; } a:hover { text-decoration: underline; }
  .card { background: var(--card); border: 1px solid var(--divider); border-radius: 16px; padding: 20px; box-shadow: var(--shadow); }
  .stack { display: flex; flex-direction: column; gap: 16px; }
  .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .btn { height: 36px; padding: 0 16px; border-radius: 18px; border: 0; background: var(--text); color: var(--bg); font: 500 14px Roboto, Arial, sans-serif; cursor: pointer;
         display: inline-flex; align-items: center; gap: 6px; text-decoration: none !important; }
  .btn:hover { opacity: .85; }
  .btn.blue { background: var(--blue); color: #fff; }
  @media (prefers-color-scheme: dark) { .btn.blue { color: #0f0f0f; } }
  .btn.tonal { background: var(--tonal); color: var(--text); } .btn.tonal:hover { background: var(--tonal-hover); opacity: 1; }
  .btn.text { background: none; color: var(--text); padding: 0 12px; } .btn.text:hover { background: var(--tonal); opacity: 1; }
  .btn.outline { background: none; color: var(--text); border: 1px solid var(--divider); } .btn.outline:hover { background: var(--tonal); opacity: 1; }
  .btn:disabled { opacity: .5; cursor: default; }
  .back { display: inline-flex; align-items: center; gap: 4px; background: none; border: 0; padding: 0; color: var(--muted); font: 500 14px Roboto, Arial, sans-serif; cursor: pointer; margin-bottom: 12px; }
  .back:hover { color: var(--text); }
  input[type=text], textarea { width: 100%; font: inherit; color: var(--text); background: var(--field); border: 1px solid var(--field-border); border-radius: 8px; padding: 10px 12px; }
  textarea { resize: vertical; min-height: 72px; }
  input:focus, textarea:focus { outline: none; border-color: var(--focus); box-shadow: inset 0 0 0 1px var(--focus); }
  .seg { display: flex; gap: 8px; flex-wrap: wrap; }
  .seg button { height: 36px; padding: 0 14px; border-radius: 8px; border: 0; background: var(--tonal); color: var(--text); font: 500 14px Roboto, Arial, sans-serif; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--text); color: var(--bg); }
  .pill { display: inline-block; font-size: 12px; line-height: 20px; padding: 0 8px; border-radius: 10px; background: var(--tonal); white-space: nowrap; }
  .pill.blue { background: var(--blue-soft); color: var(--blue); font-weight: 500; }
  .pill.ok { background: rgba(43,166,64,.12); color: var(--ok); font-weight: 500; }
  ul.clean { margin: 0; padding-left: 18px; } ul.clean li { margin: 4px 0; }
  .error { background: var(--tonal); border-radius: 8px; padding: 10px 12px; margin: 12px 0; } .error:empty { display: none; }
  .busy { color: var(--muted); padding: 12px 0; }
  .ask { display: flex; gap: 8px; } .ask input { flex: 1; }
  /* The three questions */
  .flow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 16px 0; }
  .flow div { background: var(--tonal); border-radius: 12px; padding: 14px; } .flow b { display: block; font-size: 15px; margin-bottom: 2px; }
  @media (max-width: 720px) { .flow { grid-template-columns: 1fr; } }
  .theme-card .ev { color: var(--muted); font-size: 13px; line-height: 18px; margin: 6px 0 12px; }
  .career-card { display: flex; flex-direction: column; gap: 6px; }
  .career-card .grow { flex: 1; }
  /* A path */
  .hero { position: relative; border-radius: 20px; overflow: hidden; padding: 28px 32px; color: #fff; margin-bottom: 16px;
          background: radial-gradient(circle at 85% 30%, rgba(255,255,255,.14), transparent 40%), linear-gradient(120deg, #13233b 0%, #1d3f73 55%, #2f6fe0 100%); }
  .hero .back { color: rgba(255,255,255,.8); } .hero .back:hover { color: #fff; }
  .hero .kicker { letter-spacing: .08em; text-transform: uppercase; font-size: 12px; font-weight: 500; opacity: .8; }
  .hero h1 { font-size: 40px; line-height: 48px; margin: 6px 0 8px; }
  .hero p { max-width: 640px; font-size: 16px; line-height: 24px; opacity: .92; }
  .hero .btn { background: #fff; color: #0f0f0f; } .hero .btn.ghost { background: rgba(255,255,255,.16); color: #fff; }
  .hero .mark { position: absolute; right: 32px; top: 50%; transform: translateY(-50%); width: 160px; height: 160px; opacity: .14; }
  @media (max-width: 720px) { .hero h1 { font-size: 30px; line-height: 38px; } .hero .mark { display: none; } }
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 16px; }
  .tabs button { height: 36px; padding: 0 16px; border-radius: 18px; border: 0; background: transparent; color: var(--text); font: 500 14px Roboto, Arial, sans-serif; cursor: pointer; }
  .tabs button:hover { background: var(--tonal); }
  .tabs button[aria-selected="true"] { background: var(--text); color: var(--bg); }
  .tabs .tick { color: var(--ok); margin-left: 4px; }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
  @media (max-width: 980px) { .layout { grid-template-columns: minmax(0, 1fr); } }
  .steps { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 12px; margin-top: 12px; }
  .step { border: 1px solid var(--divider); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 6px; }
  .step .num { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; }
  .step p { color: var(--muted); flex: 1; margin: 0 0 8px; }
  .step .btn { align-self: flex-start; }
  .s1 .num { background: var(--s1); } .s2 .num { background: var(--s2); } .s3 .num { background: var(--s3); } .s4 .num { background: var(--s4); }
  .step.heart { border-color: var(--s2); box-shadow: inset 0 0 0 1px var(--s2); }
  .stories { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin-top: 12px; }
  .story { border-radius: 12px; padding: 14px; background: var(--tonal); color: var(--text); display: flex; flex-direction: column; gap: 6px; min-height: 96px; }
  .story:hover { background: var(--tonal-hover); text-decoration: none; }
  .story .play { width: 28px; height: 28px; border-radius: 50%; background: var(--text); color: var(--bg); display: grid; place-items: center; font-size: 11px; }
  .facts .fact { display: grid; grid-template-columns: 22px 1fr; gap: 10px; padding: 8px 0; }
  .facts .fact svg { width: 20px; height: 20px; margin-top: 2px; color: var(--muted); }
  .facts .fact b { display: block; font-weight: 500; }
  .enjoy { background: var(--blue-soft); border: 0; }
  .enjoy li { list-style: none; display: flex; gap: 8px; margin: 6px 0; }
  .enjoy li::before { content: "✓"; color: var(--ok); font-weight: 700; }
  .enjoy ul { padding: 0; margin: 8px 0 12px; }
  .related button { display: block; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--divider); padding: 10px 0; color: var(--text); font: inherit; cursor: pointer; }
  .related button:first-of-type { border-top: 0; }
  .related button:hover b { text-decoration: underline; }
  .brief { border-left: 4px solid var(--s2); }
  .brief .client { color: var(--muted); margin-bottom: 8px; }
  .together { background: var(--blue-soft); color: var(--text); border-radius: 10px; padding: 10px 12px; margin: 12px 0; }
  table.routes { width: 100%; border-collapse: collapse; }
  table.routes td, table.routes th { text-align: left; padding: 10px 8px; border-top: 1px solid var(--divider); vertical-align: top; }
  table.routes th { font-weight: 500; color: var(--muted); font-size: 12px; border-top: 0; }
  .reflect label { display: block; font-weight: 500; margin: 14px 0 6px; }
  .record li { margin: 6px 0; }
  #toast { position: fixed; left: 12px; bottom: 12px; background: var(--text); color: var(--bg); border-radius: 8px; padding: 14px 16px; max-width: 90vw; display: none; }
  footer.foot { margin-top: 32px; padding-top: 16px; border-top: 1px solid var(--divider); color: var(--muted); font-size: 12px; line-height: 18px; }
</style>
</head>
<body>
<main>
  <header class="top"><img class="for-light" src="icons/48.png" alt=""><img class="for-dark" src="icons/light/48.png" alt=""><span><span data-brand>Aim</span> · Pathways</span></header>
  <div id="screen" aria-live="polite"></div>
</main>
<div id="toast" role="status"></div>
<script src="pathways-ui.js"></script>
<script src="pathways.js"></script>
</body>
</html>
