<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aim Plus</title>
<link rel="stylesheet" href="aim.css">
<style>
  /* Aim Plus: what it is (before you have it), and where everything starts (once you do). */
  .welcome { background: var(--primary); color: var(--on-primary); border: 0; }
  .welcome h1 { color: inherit; margin-bottom: 4px; } .welcome p { opacity: .9; margin: 0; }
  .features { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; margin-top: 16px; }
  .feature { display: flex; flex-direction: column; gap: 6px; }
  .feature h2 { display: flex; align-items: center; gap: 8px; }
  .feature .icon { width: 32px; height: 32px; border-radius: 10px; background: var(--learn-soft); color: var(--learn); display: grid; place-items: center; flex: none; }
  .feature p { color: var(--muted); margin: 0; flex: 1; }
  .feature .live { color: var(--text); font-size: 13px; background: var(--tonal); border-radius: 8px; padding: 6px 10px; }
  .feature .row { margin-top: 8px; }
  .how { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<main class="page wide">
  <header class="page-head">
    <img class="for-light" src="icons/48.png" alt=""><img class="for-dark" src="icons/light/48.png" alt="">
    <span class="brand" data-brand>Aim</span><span class="crumb">Plus</span>
  </header>
  <div id="screen" aria-live="polite"></div>
</main>
<div id="toast" role="status"></div>
<script src="plus-home.js"></script>
</body>
</html>
