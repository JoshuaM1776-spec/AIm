<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TeachBack</title>
<style>
  /* Same palette and shapes as Aim's settings page (YouTube's own look), following Chrome's light/dark mode. */
  :root { --bg:#fff; --text:#0f0f0f; --muted:#606060; --divider:rgba(0,0,0,.1); --tonal:rgba(0,0,0,.05); --tonal-hover:rgba(0,0,0,.1);
          --field:#fff; --field-border:#ccc; --focus:#1c62b9; --link:#065fd4; --raised:#f9f9f9; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f0f0f; --text:#f1f1f1; --muted:#aaa; --divider:rgba(255,255,255,.1); --tonal:rgba(255,255,255,.1); --tonal-hover:rgba(255,255,255,.2);
            --field:#121212; --field-border:#303030; --focus:#1c62b9; --link:#3ea6ff; --raised:#212121; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/20px Roboto, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  main { max-width: 680px; margin: 0 auto; padding: 32px 24px 80px; }
  header { display: flex; align-items: center; gap: 8px; color: var(--muted); margin-bottom: 20px; }
  .logo { width: 24px; height: 24px; }
  .for-dark { display: none; }
  @media (prefers-color-scheme: dark) { .for-dark { display: block; } .for-light { display: none; } }
  h1 { font-size: 24px; line-height: 32px; font-weight: 700; margin: 0 0 8px; }
  h2 { font-size: 16px; line-height: 22px; font-weight: 500; margin: 24px 0 8px; }
  p { margin: 0 0 12px; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; line-height: 18px; }
  label { display: block; font-weight: 500; margin: 16px 0 6px; }
  input[type=text], textarea {
    width: 100%; font: inherit; color: var(--text); background: var(--field); border: 1px solid var(--field-border); border-radius: 8px; padding: 10px 12px;
  }
  textarea { resize: vertical; min-height: 96px; }
  input:focus, textarea:focus { outline: none; border-color: var(--focus); box-shadow: inset 0 0 0 1px var(--focus); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
  .spread { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .btn { height: 36px; padding: 0 16px; border-radius: 18px; border: 0; background: #ff0033; color: #fff; font: 500 14px Roboto, Arial, sans-serif; cursor: pointer; }
  .btn:hover { background: #e0002c; }
  .btn.tonal { background: var(--tonal); color: var(--text); }
  .btn.tonal:hover { background: var(--tonal-hover); opacity: 1; }
  .btn.text { background: none; color: var(--text); padding: 0 12px; }
  .btn.text:hover { background: var(--tonal); opacity: 1; }
  .btn:disabled { opacity: .45; cursor: default; }
  .card { border: 1px solid var(--divider); border-radius: 12px; padding: 16px; margin: 12px 0; }
  .student { display: flex; align-items: center; gap: 10px; margin: 20px 0 8px; }
  .face { width: 36px; height: 36px; border-radius: 50%; background: var(--tonal); display: grid; place-items: center; font-weight: 700; flex: none; }
  .student b { display: block; font-weight: 500; }
  .question { font-size: 20px; line-height: 28px; margin: 0 0 16px; }
  .note { background: var(--raised); border-radius: 8px; padding: 10px 12px; margin: 12px 0; }
  .pill { display: inline-block; font-size: 12px; line-height: 20px; padding: 0 8px; border-radius: 10px; background: var(--tonal); margin-right: 6px; white-space: nowrap; }
  .pill.strong { background: var(--text); color: var(--bg); }
  .quote { border-left: 3px solid var(--divider); padding: 2px 0 2px 10px; margin: 8px 0; color: var(--muted); }
  ul { margin: 0 0 12px; padding-left: 20px; }
  a { color: var(--link); text-decoration: none; } a:hover { text-decoration: underline; }
  .error { color: var(--text); background: var(--raised); border-radius: 8px; padding: 10px 12px; margin: 12px 0; }
  .error:empty { display: none; }
  .busy { color: var(--muted); margin-top: 12px; }
  .busy:empty { display: none; }
  #toast { position: fixed; left: 12px; bottom: 12px; background: var(--text); color: var(--bg); border-radius: 8px; padding: 14px 16px; max-width: 90vw; display: none; }
</style>
</head>
<body>
<main>
  <header>
    <img class="logo for-light" src="icons/48.png" alt=""><img class="logo for-dark" src="icons/light/48.png" alt="">
    <span><span data-brand>Aim</span> · TeachBack</span>
  </header>
  <div id="screen" aria-live="polite"></div>
</main>
<div id="toast" role="status"></div>
<script src="teachback.js"></script>
</body>
</html>
