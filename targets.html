<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aims</title>
<link rel="stylesheet" href="aim.css">
<style>
  /* Aims: each group is a card of rows. */
  #list .card h2 { margin-bottom: 4px; }
  .notes { margin-top: 4px; font-size: 13px; }
  .notes summary { cursor: pointer; color: var(--link); font-weight: 500; }
  .notes div { white-space: pre-wrap; background: var(--tonal); border-radius: 8px; padding: 8px 10px; margin-top: 6px; }
  .aims-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .aims-head h1 { margin: 0; }
  .tabs { display: flex; gap: 8px; margin: 16px 0 14px; flex-wrap: wrap; }
  .tabs button { height: 34px; padding: 0 16px; border-radius: 17px; border: 1px solid var(--card-border); background: var(--surface); color: var(--text);
    font: 500 14px var(--font); cursor: pointer; }
  .tabs button:hover { background: var(--tonal); }
  .tabs button[aria-selected="true"] { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
  .tabs .n { margin-left: 6px; opacity: .7; font-weight: 400; }
  .progress { display: flex; align-items: center; gap: 10px; margin-top: 6px; font-size: 12px; color: var(--muted); }
  .progress .track { flex: 0 1 180px; height: 5px; border-radius: 3px; background: var(--tonal); overflow: hidden; }
  .progress .track i { display: block; height: 100%; background: var(--primary); border-radius: 3px; }
  .empty-tab { color: var(--muted); padding: 8px 2px; }
</style>
</head>
<body>
<main class="page">
  <header class="page-head">
    <img class="for-light" src="icons/48.png" alt=""><img class="for-dark" src="icons/light/48.png" alt="">
    <span class="brand" data-brand>Aim</span><span class="crumb">Aims</span>
    <span class="end"><a href="record.html">Learning record</a></span>
  </header>
  <div class="aims-head">
    <h1>Your aims</h1>
    <a class="btn" id="newAim" href="https://www.youtube.com/">+ New aim</a>
  </div>
  <p class="muted">Pick up where you left off, or start a finished aim again.</p>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div id="list" aria-live="polite"></div>
</main>
<div id="toast" role="status"></div>
<script src="targets.js"></script>
</body>
</html>
