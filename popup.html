<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* Looks like a YouTube menu: same palette, dividers between sections, neutral buttons. */
  :root { --bg:#fff; --text:#0f0f0f; --muted:#606060; --divider:rgba(0,0,0,.1); --tonal:rgba(0,0,0,.05); --tonal-hover:rgba(0,0,0,.1); --hover:rgba(0,0,0,.05); }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#282828; --text:#f1f1f1; --muted:#aaa; --divider:rgba(255,255,255,.1); --tonal:rgba(255,255,255,.1); --tonal-hover:rgba(255,255,255,.2); --hover:rgba(255,255,255,.1); }
  }
  * { box-sizing: border-box; }
  body { width: 340px; margin: 0; padding: 8px 0; background: var(--bg); color: var(--text); font: 14px/20px Roboto, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  .brand { display:flex; align-items:center; gap:8px; font-weight:700; font-size:16px; padding: 8px 16px 12px; }
  .logo { width: 24px; height: 24px; }
  .for-dark { display: none; }
  @media (prefers-color-scheme: dark) { .for-dark { display: inline; } .for-light { display: none; } }
  h2 { font-size: 14px; line-height: 20px; font-weight: 500; margin: 0; padding: 12px 16px 4px; border-top: 1px solid var(--divider); }
  #session { padding: 0 16px 12px; }
  #session .card { background: var(--tonal); border-radius: 12px; padding: 12px; }
  .card { padding: 0 16px 8px; }
  .strong { font-weight: 500; }
  .muted { color: var(--muted); font-size: 12px; line-height: 18px; }
  .tag { font-size: 12px; line-height: 18px; color: var(--muted); }
  .bar { height:4px; background:var(--tonal); border-radius:2px; overflow:hidden; margin:8px 0 6px; }
  .bar i { display:block; height:100%; background:var(--text); border-radius:2px; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .item { padding: 8px 0; }
  .item + .item { border-top: 1px solid var(--divider); }
  a { color: var(--text); text-decoration: none; display: block; min-width: 0; }
  a:hover div:first-child { text-decoration: underline; }
  .x { background:none; border:0; color:var(--muted); cursor:pointer; width: 32px; height: 32px; border-radius: 50%; font-size:18px; flex: none; }
  .x:hover { background: var(--hover); color: var(--text); }
  .btn { background: var(--tonal); color: var(--text); border: 0; border-radius: 18px; height: 36px; padding: 0 16px; font: 500 14px Roboto, Arial, sans-serif; cursor: pointer; white-space: nowrap; }
  .btn:hover { background: var(--tonal-hover); }
  .btn.ghost { background: var(--tonal); }
  .foot { display:flex; justify-content:flex-start; padding: 12px 16px 4px; border-top: 1px solid var(--divider); }
  .foot a { color: var(--muted); font-size: 12px; cursor: pointer; display: inline; }
  .foot a:hover { color: var(--text); }
  .brand .icon-btn { margin-left: auto; }
  .icon-btn { width: 36px; height: 36px; border-radius: 50%; border: 0; background: none; color: var(--text); display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .icon-btn:hover { background: var(--hover); }
  .ring-row { display: flex; align-items: center; gap: 12px; margin: 12px 0; }
  .ring { flex: none; transform: rotate(-90deg); }
  .ring .track { stroke: var(--divider); } .ring .fill { stroke: var(--text); transition: stroke-dashoffset .3s; }
  .big { font-size: 16px; font-weight: 500; }
  .btn.wide { width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; background: var(--bg); }
  .btn.wide:hover { background: var(--tonal-hover); }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  .pair .btn { background: var(--bg); } .pair .btn:hover { background: var(--tonal-hover); }
  .btn.primary { background: var(--text); color: var(--bg); } .btn.primary:hover { opacity: .85; background: var(--text); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; align-items: center; }
  .chip { height: 32px; padding: 0 12px; border-radius: 8px; border: 0; background: var(--bg); color: var(--text); font: 500 14px Roboto, Arial, sans-serif; cursor: pointer; }
  .chip:hover { background: var(--tonal-hover); } .chip:disabled { opacity: .45; cursor: default; }
  .field { width: 100%; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--divider); border-radius: 8px; padding: 8px 10px; margin-top: 8px; }
  .field:focus { outline: none; border-color: #1c62b9; box-shadow: inset 0 0 0 1px #1c62b9; }
  .stack { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .link { background: none; border: 0; padding: 4px 0; color: var(--text); font: inherit; text-align: left; cursor: pointer; }
  .link:hover { text-decoration: underline; }
  .bars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; align-items: end; height: 56px; margin: 4px 0; }
  .bar7 { display: flex; flex-direction: column-reverse; height: 100%; border-radius: 3px; overflow: hidden; background: var(--tonal); }
  .bar7 .p { background: var(--text); } .bar7 .l { background: var(--muted); }
  .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; font-size: 11px; color: var(--muted); }
  .key { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
</style>
</head>
<body>
  <div class="brand">
    <img class="logo for-light" src="icons/48.png" alt=""><img class="logo for-dark" src="icons/light/48.png" alt="">
    <span data-brand>Aim</span>
    <button class="icon-btn" id="settings" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M19.4 13.5l1.6 1.2-1.8 3.1-1.9-.7a7 7 0 0 1-1.7 1l-.3 2h-3.6l-.3-2a7 7 0 0 1-1.7-1l-1.9.7-1.8-3.1 1.6-1.2a7 7 0 0 1 0-3l-1.6-1.2 1.8-3.1 1.9.7a7 7 0 0 1 1.7-1l.3-2h3.6l.3 2a7 7 0 0 1 1.7 1l1.9-.7 1.8 3.1-1.6 1.2a7 7 0 0 1 0 3z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg></button>
  </div>
  <div id="session"></div>
  <h2>This week</h2>
  <div class="card" id="week"></div>
  <h2>Today</h2>
  <div class="card" id="today"></div>
  <h2>Saved for later</h2>
  <div class="card" id="saved"></div>
  <h2>Recent</h2>
  <div class="card" id="history"></div>
  <div class="foot"><a id="allTargets">All Targets</a> · <a id="clear">Clear history</a></div>
  <script src="popup.js"></script>
</body>
</html>
