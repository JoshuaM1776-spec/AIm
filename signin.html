<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<title>Signing in</title>
<link rel="stylesheet" href="aim.css">
<style>
  /* Sign-in: one centered card. */
  .page { max-width: 480px; padding-top: 15vh; text-align: center; }
  .card img { width: 48px; height: 48px; }
  h1 { font-size: 22px; line-height: 30px; margin: 16px 0 8px; }
  #detail { color: var(--muted); margin: 0 0 20px; }
</style>
</head>
<body>
<main class="page"><div class="card">
  <img class="for-light" src="icons/48.png" alt=""><img class="for-dark" src="icons/light/48.png" alt="">
  <h1 id="title">Signing you in…</h1>
  <p id="detail"></p>
  <button class="btn" id="settings" hidden>Open Settings</button>
</div></main>
<script src="signin.js"></script>
</body>
</html>
