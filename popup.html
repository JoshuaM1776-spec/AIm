<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* Looks like a YouTube menu: same palette, dividers between sections, neutral buttons. */
  :root { --bg:#fff; --text:#0f0f0f; --muted:#606060; --divider:rgba(0,0,0,.1); --tonal:rgba(0,0,0,.05); --tonal-hover:rgba(0,0,0,.1); --hover:rgba(0,0,0,.05); }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#282828; --text:#f1f1f1; --muted:#aaa; --divider:rgba(255,255,255,.1); --tonal:rgba(255,255,255,.1); --tonal-hover:rgba(255,255,255,.2); --hover:rgba(255,255,255,.1); }
  }
  * { box-sizing: border-box; }
  body { width: 340px; margin: 0; padding: 8px 0; background: var(--bg); color: var(--text); font: 14px/20px Roboto, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  .brand { display:flex; align-items:center; gap:8px; font-weight:700; font-size:16px; padding: 8px 16px 12px; }
  .logo { width: 24px; height: 24px; }
  .for-dark { display: none; }
  @media (prefers-color-scheme: dark) { .for-dark { display: inline; } .for-light { display: none; } }
  h2 { font-size: 14px; line-height: 20px; font-weight: 500; margin: 0; padding: 12px 16px 4px; border-top: 1px solid var(--divider); }
  #session { padding: 0 16px 12px; }
  #session .card { background: var(--tonal); border-radius: 12px; padding: 12px; }
  .card { padding: 0 16px 8px; }
  .strong { font-weight: 500; }
  .muted { color: var(--muted); font-size: 12px; line-height: 18px; }
  .tag { font-size: 12px; line-height: 18px; color: var(--muted); }
  .bar { height:4px; background:var(--tonal); border-radius:2px; overflow:hidden; margin:8px 0 6px; }
  .bar i { display:block; height:100%; background:var(--text); border-radius:2px; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .item { padding: 8px 0; }
  .item + .item { border-top: 1px solid var(--divider); }
  a { color: var(--text); text-decoration: none; display: block; min-width: 0; }
  a:hover div:first-child { text-decoration: underline; }
  .x { background:none; border:0; color:var(--muted); cursor:pointer; width: 32px; height: 32px; border-radius: 50%; font-size:18px; flex: none; }
  .x:hover { background: var(--hover); color: var(--text); }
  .btn { background: var(--tonal); color: var(--text); border: 0; border-radius: 18px; height: 36px; padding: 0 16px; font: 500 14px Roboto, Arial, sans-serif; cursor: pointer; white-space: nowrap; }
  .btn:hover { background: var(--tonal-hover); }
  .btn.ghost { background: var(--tonal); }
  .foot { display:flex; justify-content:space-between; padding: 12px 16px 4px; border-top: 1px solid var(--divider); }
  .foot a { color: var(--muted); font-size: 12px; cursor: pointer; display: inline; }
  .foot a:hover { color: var(--text); }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
</style>
</head>
<body>
  <div class="brand">
    <img class="logo for-light" src="icons/48.png" alt=""><img class="logo for-dark" src="icons/light/48.png" alt="">
    Aim
  </div>
  <div id="session"></div>
  <h2>Saved for later</h2>
  <div class="card" id="saved"></div>
  <h2>Today</h2>
  <div class="card" id="today"></div>
  <h2>Recent sessions</h2>
  <div class="card" id="history"></div>
  <div class="foot"><a id="clear">Clear history</a><a id="settings">Settings</a></div>
  <script src="popup.js"></script>
</body>
</html>
