<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personalize your YouTube</title>
<link rel="stylesheet" href="aim.css">
<style>
  /* Three short, skippable steps: why you use YouTube, what you already follow (in groups you can
     keep, rename or skip), and your first aims. Setting up your own library, not a quiz. */
  .stepper { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 8px; }
  .stepper .of { color: var(--muted); font-size: 13px; }
  .bar3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 0 0 24px; }
  .bar3 i { height: 4px; border-radius: 2px; background: var(--tonal-hover); }
  .bar3 i.on { background: var(--primary); }
  .choices { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; margin: 16px 0; }
  .choice { display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--card-border); background: var(--surface); text-align: left;
    color: var(--text); font: inherit; cursor: pointer; }
  .choice b { font-weight: 500; }
  .choice span { color: var(--muted); font-size: 13px; line-height: 19px; }
  .choice[aria-pressed="true"] { border-color: var(--primary); box-shadow: inset 0 0 0 1.5px var(--primary); }
  .groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; margin: 16px 0; }
  .group { display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--card-border); background: var(--surface); }
  .group.off { opacity: .55; }
  .group input.gname { font: 500 19px/24px var(--font-serif); border: 0; background: transparent; padding: 0; height: auto; border-radius: 0; color: var(--text); }
  .group input.gname:focus { box-shadow: none; border-bottom: 1px solid var(--focus); }
  .group .about { color: var(--muted); font-size: 13px; line-height: 19px; }
  .group .meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: auto; padding-top: 6px; font-size: 13px; }
  .members { grid-column: 1 / -1; padding: 14px 16px; border-radius: 12px; background: var(--tonal); }
  .member { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 6px 0; border-top: 1px solid var(--divider); }
  .member:first-of-type { border-top: 0; }
  .member label { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .member img { width: 24px; height: 24px; border-radius: 50%; flex: none; }
  .member select { height: 32px; font-size: 13px; }
  .aims { display: flex; flex-direction: column; gap: 10px; margin: 16px 0; }
  .aim-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--card-border); background: var(--surface); }
  .aim-row small { color: var(--muted); }
  .aim-row .active { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); white-space: nowrap; }
  .note-line { color: var(--muted); font-size: 13px; line-height: 19px; }
  .foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 20px; flex-wrap: wrap; }
  .foot .right { display: flex; gap: 8px; }
  @media (max-width: 560px) { .aim-row { grid-template-columns: auto minmax(0, 1fr); } .aim-row .active { grid-column: 2; } }
</style>
</head>
<body>
<main class="page">
  <header class="page-head">
    <img class="for-light" src="icons/48.png" alt=""><img class="for-dark" src="icons/light/48.png" alt="">
    <span class="brand" data-brand>Aim</span><span class="crumb"><a href="targets.html">Library</a> · Personalize</span>
  </header>
  <div id="page" aria-live="polite"></div>
</main>
<div id="toast" role="status"></div>
<script src="nav.js"></script>
<script src="content/topics.js"></script>
<script src="personalize.js"></script>
</body>
</html>
