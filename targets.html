<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your library</title>
<link rel="stylesheet" href="aim.css">
<style>
  /* The library: every aim as a book on a shelf. Covers: covers.js and aim.css. */
  .lib-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .lib-head h1 { font: 500 38px/44px var(--font-serif); letter-spacing: -.5px; margin: 0; }
  .lib-head .lede { margin: 4px 0 0; }
  .lib-tools { display: flex; gap: 10px; align-items: center; }
  .lib-search { height: 38px; width: 220px; padding: 0 14px; border-radius: 19px; border: 1px solid var(--field-border); background: var(--field); color: var(--text); font: inherit; }
  .lib-search:focus { outline: none; border-color: var(--focus); }
  .tabs { display: flex; gap: 8px; margin: 22px 0 18px; flex-wrap: wrap; }
  .tabs button { height: 34px; padding: 0 16px; border-radius: 17px; border: 1px solid var(--card-border); background: var(--surface); color: var(--text); font: 500 14px var(--font); cursor: pointer; }
  .tabs button:hover { background: var(--tonal); }
  .tabs button[aria-selected="true"] { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
  .tabs .n { margin-left: 6px; opacity: .7; font-weight: 400; }
  .shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 28px 22px; padding: 22px 22px 26px; border-radius: 16px;
    background: linear-gradient(var(--tonal) 0 0) bottom / 100% 10px no-repeat, var(--surface); border: 1px solid var(--card-border); }
  .slot { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .slot > button { display: block; width: 100%; padding: 0; border: 0; background: none; cursor: pointer; text-align: left; border-radius: 10px; transition: transform .15s; }
  .slot > button:hover { transform: translateY(-3px); }
  .slot > button:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
  .slot .where { font-size: 12px; line-height: 16px; color: var(--muted); }
  .new-book { aspect-ratio: 3 / 4.2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; border: 1.5px dashed var(--field-border);
    border-radius: 4px 10px 10px 4px; color: var(--muted); text-align: center; padding: 12px; font-size: 13px; text-decoration: none; }
  .new-book:hover { color: var(--text); border-color: var(--muted); text-decoration: none; }
  .new-book b { font: 500 18px var(--font-serif); color: var(--text); }
  .empty-tab { color: var(--muted); padding: 8px 2px; grid-column: 1 / -1; }
  @media (prefers-reduced-motion: reduce) { .slot > button { transition: none; } }
</style>
</head>
<body>
<main class="page wide">
  <header class="page-head">
    <img class="for-light" src="icons/48.png" alt=""><img class="for-dark" src="icons/light/48.png" alt="">
    <span class="brand" data-brand>Aim</span><span class="crumb">Library</span>
    <span class="end"><a href="record.html">Learning record</a></span>
  </header>
  <div class="lib-head">
    <div><h1>Your library</h1><p class="lede">A collection of what you're learning. Open a book to see where you are with it.</p></div>
    <div class="lib-tools">
      <input class="lib-search" id="search" type="search" placeholder="Search your library…" aria-label="Search your library">
      <a class="btn" id="newAim" href="https://www.youtube.com/">+ New aim</a>
    </div>
  </div>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="shelf" id="list" aria-live="polite"></div>
</main>
<div id="toast" role="status"></div>
<script src="covers.js"></script>
<script src="targets.js"></script>
</body>
</html>
