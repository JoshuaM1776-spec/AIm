<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your library</title>
<link rel="stylesheet" href="aim.css">
<style>
  /* The library: every aim as a book on a shelf. Covers: covers.js and aim.css. */
  .lib-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .lib-head h1 { font: 500 38px/44px var(--font-serif); letter-spacing: -.5px; margin: 0; }
  .lib-head .lede { margin: 4px 0 0; }
  .lib-tools { display: flex; gap: 10px; align-items: center; }
  .lib-search { height: 38px; width: 220px; padding: 0 14px; border-radius: 19px; border: 1px solid var(--field-border); background: var(--field); color: var(--text); font: inherit; }
  .lib-search:focus { outline: none; border-color: var(--focus); }
  .tabs { display: flex; gap: 8px; margin: 22px 0 18px; flex-wrap: wrap; }
  .tabs button { height: 34px; padding: 0 16px; border-radius: 17px; border: 1px solid var(--card-border); background: var(--surface); color: var(--text); font: 500 14px var(--font); cursor: pointer; }
  .tabs button:hover { background: var(--tonal); }
  .tabs button[aria-selected="true"] { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
  .tabs .n { margin-left: 6px; opacity: .7; font-weight: 400; }
  /* A bookcase, drawn: dark wood with a little grain, each row of books standing on a plank. */
  .shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); row-gap: 26px; padding: 26px 18px 20px; border-radius: 14px;
    background:
      repeating-linear-gradient(90deg, rgba(255, 230, 190, .025) 0 2px, transparent 2px 9px, rgba(0, 0, 0, .04) 9px 10px, transparent 10px 23px),
      radial-gradient(120% 90% at 50% 0%, #3b2a1f, #1f150e 70%);
    box-shadow: inset 0 0 0 10px #3a2617, inset 0 0 0 11px rgba(0, 0, 0, .35), inset 0 18px 30px rgba(0, 0, 0, .35), 0 10px 26px rgba(30, 20, 10, .25); }
  .slot { display: flex; flex-direction: column; min-width: 0; padding: 0 11px; }
  .slot > button, .slot > .new-book { position: relative; z-index: 1; margin: 0 6px; }
  .slot > button { display: block; padding: 0; border: 0; background: none; cursor: pointer; text-align: left; border-radius: 10px; transition: transform .15s; }
  .slot > button:hover { transform: translateY(-4px); }
  .slot > button:focus-visible { outline: 2px solid #f1dfae; outline-offset: 3px; }
  .plank { height: 13px; margin: 0 -11px; border-radius: 1px;
    background: linear-gradient(#9a6a3e, #7a4f2b 35%, #5a381d); box-shadow: inset 0 1px 0 rgba(255, 220, 170, .35), 0 6px 10px rgba(0, 0, 0, .45); }
  .slot .where { margin-top: 8px; font-size: 12px; line-height: 16px; color: rgba(241, 223, 190, .75); text-align: center; }
  .new-book { aspect-ratio: 3 / 4.25; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; border: 1.5px dashed rgba(241, 223, 190, .35);
    border-radius: 3px 9px 9px 3px; color: rgba(241, 223, 190, .7); text-align: center; padding: 12px; font-size: 13px; text-decoration: none; background: rgba(255, 240, 210, .04); }
  .new-book:hover { color: #f1dfae; border-color: rgba(241, 223, 190, .6); text-decoration: none; }
  .new-book b { font: 500 19px var(--font-serif); color: #f1dfae; }
  .empty-tab { color: rgba(241, 223, 190, .8); padding: 8px 12px; grid-column: 1 / -1; }
  @media (prefers-reduced-motion: reduce) { .slot > button { transition: none; } }
</style>
</head>
<body>
<main class="page wide">
  <header class="page-head">
    <img class="for-light" src="icons/48.png" alt=""><img class="for-dark" src="icons/light/48.png" alt="">
    <span class="brand" data-brand>Aim</span><span class="crumb">Library</span>
    <span class="end"><a href="record.html">Learning record</a></span>
  </header>
  <div class="lib-head">
    <div><h1>Your library</h1><p class="lede">A collection of what you're learning. Open a book to see where you are with it.</p></div>
    <div class="lib-tools">
      <input class="lib-search" id="search" type="search" placeholder="Search your library…" aria-label="Search your library">
      <a class="btn" id="newAim" href="https://www.youtube.com/">+ New aim</a>
    </div>
  </div>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="shelf" id="list" aria-live="polite"></div>
</main>
<div id="toast" role="status"></div>
<script src="covers.js"></script>
<script src="targets.js"></script>
</body>
</html>
