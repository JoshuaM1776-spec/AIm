<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aims</title>
<link rel="stylesheet" href="aim.css">
<style>
  /* Aims: each group is a card of rows. */
  #list .card h2 { margin-bottom: 4px; }
  .notes { margin-top: 4px; font-size: 13px; }
  .notes summary { cursor: pointer; color: var(--link); font-weight: 500; }
  .notes div { white-space: pre-wrap; background: var(--tonal); border-radius: 8px; padding: 8px 10px; margin-top: 6px; }
</style>
</head>
<body>
<main class="page">
  <header class="page-head">
    <img class="for-light" src="icons/48.png" alt=""><img class="for-dark" src="icons/light/48.png" alt="">
    <span class="brand" data-brand>Aim</span><span class="crumb">Aims</span>
    <span class="end"><a href="record.html">Learning record</a></span>
  </header>
  <h1>Your aims</h1>
  <p class="muted">Pick up where you left off, or start a finished aim again.</p>
  <div id="list" aria-live="polite"></div>
</main>
<div id="toast" role="status"></div>
<script src="targets.js"></script>
</body>
</html>
