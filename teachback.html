<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TeachBack</title>
<link rel="stylesheet" href="aim.css">
<style>
  /* TeachBack: the conversation sits in one card; results are a stack of cards. */
  .student { display: flex; align-items: center; gap: 10px; margin: 20px 0 8px; }
  .face { width: 36px; height: 36px; border-radius: 50%; background: var(--learn-soft); color: var(--learn); display: grid; place-items: center; font-weight: 700; flex: none; }
  .student b { display: block; font-weight: 500; }
  .question { font-size: 20px; line-height: 28px; margin: 0 0 16px; }
  #screen > .card + .card { margin-top: 12px; }
</style>
</head>
<body>
<main class="page">
  <header class="page-head">
    <img class="for-light" src="icons/48.png" alt=""><img class="for-dark" src="icons/light/48.png" alt="">
    <span class="brand" data-brand>Aim</span><span class="crumb">TeachBack</span>
  </header>
  <div class="card" id="screen" aria-live="polite"></div>
</main>
<div id="toast" role="status"></div>
<script src="pathways-ui.js"></script>
<script src="teachback.js"></script>
</body>
</html>
