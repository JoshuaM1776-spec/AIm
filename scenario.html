<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scenario</title>
<link rel="stylesheet" href="aim.css">
<style>
  /* A scenario: the call as it unfolds on the right, the patient's monitor on the left, a debrief at the end. */
  h1.serif { font: 500 32px/38px var(--font-serif); margin: 4px 0 6px; }
  .safety { display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; border-radius: 12px; background: var(--tonal); font-size: 13px; line-height: 19px; margin: 8px 0 16px; }
  .safety b { font-weight: 600; }
  .setup label { display: flex; flex-direction: column; gap: 4px; font-weight: 500; margin-top: 12px; }
  .setup input[type=text], .setup select { font: inherit; color: var(--text); background: var(--field); border: 1px solid var(--field-border); border-radius: 10px; padding: 8px 10px; }
  .setup .refs label { flex-direction: row; align-items: center; gap: 8px; font-weight: 400; margin-top: 6px; }
  .run { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 18px; align-items: start; }
  /* The monitor: always dark, like the real thing. */
  .monitor { position: sticky; top: 16px; background: #0b0f0d; color: #dfe; border-radius: 14px; padding: 12px; box-shadow: inset 0 0 0 1px #24302a, 0 8px 24px -10px rgba(0, 0, 0, .5);
    font: 500 12px/1.2 var(--font); display: grid; gap: 8px; }
  .trace { position: relative; height: 54px; overflow: hidden; border-bottom: 1px solid #1c2621; }
  .trace svg { position: absolute; left: 0; top: 0; height: 100%; width: 200%; animation: sweep var(--dur, 4s) linear infinite; }
  .trace.off svg { animation: none; }
  @keyframes sweep { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  @media (prefers-reduced-motion: reduce) { .trace svg { animation: none; } }
  .nums { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; }
  .num { display: flex; flex-direction: column; padding: 6px 8px; border-radius: 8px; background: #111815; }
  .num span { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; opacity: .8; }
  .num b { font: 600 28px/32px var(--font); font-variant-numeric: tabular-nums; }
  .num.wide { grid-column: 1 / -1; }
  .num.wide b { font-size: 14px; line-height: 20px; font-weight: 500; }
  .hr { color: #4ade80; } .spo2 { color: #38bdf8; } .bp { color: #f87171; } .rr { color: #facc15; } .etco2 { color: #c4b5fd; } .gcs, .bgl { color: #e5e7eb; }
  .changed b { animation: blink 1.2s ease 2; }
  @keyframes blink { 50% { opacity: .35; } }
  /* The instrument panel and the situation board use the monitor's dark case. */
  .dials { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .dial { width: 100%; height: auto; }
  .engine { display: grid; gap: 6px; }
  .eng { display: grid; grid-template-columns: 64px 1fr 62px; gap: 8px; align-items: center; font-size: 11px; }
  .eng i { height: 8px; border-radius: 4px; background: #1c2621; overflow: hidden; }
  .eng i b { display: block; height: 100%; background: #4ade80; }
  .eng em { font-style: normal; text-align: right; font-variant-numeric: tabular-nums; }
  .annunciator { padding: 6px 8px; border-radius: 6px; background: #3b0d0d; color: #fca5a5; font: 700 12px/16px var(--font); letter-spacing: .06em; text-transform: uppercase; text-align: center; }
  .sev { display: flex; flex-direction: column; padding: 10px; border-radius: 8px; background: #111815; }
  .sev span { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; opacity: .8; }
  .sev b { font: 600 24px/30px var(--font); text-transform: capitalize; }
  .sev-stable b, .sev-resolved b { color: #4ade80; } .sev-worsening b { color: #facc15; } .sev-critical b { color: #f87171; }
  .feed { display: flex; flex-direction: column; gap: 10px; }
  .msg { padding: 12px 14px; border-radius: 12px; background: var(--card); box-shadow: inset 0 0 0 1px var(--card-border); line-height: 22px; }
  .msg.you { align-self: flex-end; max-width: 85%; background: var(--primary); color: var(--on-primary); box-shadow: none; }
  .msg.dispatch { background: var(--tonal); box-shadow: none; }
  .msg .tag { display: block; font: 600 11px var(--font); letter-spacing: .08em; text-transform: uppercase; opacity: .7; margin-bottom: 4px; }
  .cite { font: 600 11px var(--font); padding: 1px 6px; border-radius: 8px; border: 0; background: var(--tonal); color: var(--link); cursor: pointer; vertical-align: 1px; }
  .msg.you .cite { background: rgba(255, 255, 255, .2); color: inherit; }
  .passage { margin-top: 8px; padding: 8px 10px; border-left: 3px solid var(--primary); background: var(--tonal); border-radius: 0 8px 8px 0; font-size: 13px; line-height: 19px; white-space: pre-wrap; }
  .act textarea { width: 100%; box-sizing: border-box; min-height: 64px; font: inherit; color: var(--text); background: var(--field); border: 1px solid var(--field-border); border-radius: 12px; padding: 10px 12px; resize: vertical; }
  .act .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; align-items: center; }
  .debrief { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .debrief .card { margin: 0; }
  h2.serif { font: 500 24px/30px var(--font-serif); margin: 6px 0 12px; }
  .debrief .card h3 { font: 500 17px/24px var(--font-serif); margin: 0 0 6px; }
  .debrief .two { grid-column: span 3; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .debrief li { margin: 6px 0; }
  .removed { font-size: 13px; color: var(--muted); }
  @media (max-width: 860px) { .run, .debrief, .debrief .two { grid-template-columns: 1fr; } .debrief .two { grid-column: auto; } .monitor { position: static; } }
</style>
</head>
<body>
<main class="page wide">
  <header class="page-head">
    <img class="for-light" src="icons/48.png" alt=""><img class="for-dark" src="icons/light/48.png" alt="">
    <span class="brand" data-brand>Aim</span><span class="crumb"><a href="targets.html">Library</a><span id="aimCrumb"> · <a id="aimLink" href="targets.html">Aim</a></span> · Scenario</span>
  </header>
  <h1 class="serif" id="title">Scenario</h1>
  <div class="safety" role="note"><span aria-hidden="true">⚕</span><span><b>Practice for learning, not guidance for patient care.</b> Medications and doses come only from your references, and any dose that isn't in them is left out. For real patients, follow your current protocols and medical direction.</span></div>
  <div id="page" aria-live="polite"></div>
</main>
<div id="toast" role="status"></div>
<script src="deeper.js"></script>
<script src="scenario.js"></script>
</body>
</html>
